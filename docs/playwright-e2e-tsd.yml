    # ---------------------------------------------------------------------------
    7_impact_analysis:
      affected_components:
        new: ["playwright.config.ts", "e2e/ (helpers, fixtures, specs)", ".env.e2e.example"]
        modified: ["package.json", "vitest.config.js", ".gitignore"]
        unchanged: ["Application behaviour, SSO, email worker and signup/verification flows (apart from any small, separately reviewed data-testid additions)"]
        external: ["MailSlurp (test inbox)", "Razorpay test checkout and API"]

    # ---------------------------------------------------------------------------
    8_business_logic:
      prerequisites:
        - "Docker running both local Supabase stacks (SSO :54331, app :54321) loaded with the existing reference seeds (roles, plans, platform organisation, feature keys)."
        - "Local services: SSO worker with sync consumer, email worker, payments worker, realtime worker (`npm run dev:stack` in sso-worker), and the app on :8788. Exact command set OPEN (section 13)."
        - "Valid AWS SES credentials in the email worker .dev.vars (every signup now sends a real email) and internet access."
        - "MAILSLURP_API_KEY in .env.e2e (a MailSlurp account; see section 6)."
        - "Internet access to the Razorpay checkout and API; Razorpay test keys in the payments worker .dev.vars."
        - "Local R2 for document uploads (the `pages:dev` script already passes --r2)."
        - "Each developer's .dev.vars points at the local databases; .env.e2e filled in from .env.e2e.example."
      how_to_run:
        - "Check the mailbox path first (email worker running): `node scripts/check-mailslurp.mjs`."
        - "Terminal 1: start the stack. Terminal 2: `npm run e2e` (all), `npx playwright test e2e/learner.spec.ts` (one role), `npm run e2e:ui` (interactive)."
        - "Crashed run: `npm run e2e:cleanup`."
        - "Wait about 60 seconds between full runs if a 429 appears."
      execution_flow:
        - "Config generates the run id and password; each spec generates its users and MailSlurp inboxes."
        - "Each spec runs the journey in section 3, in order, in its own browser context."
        - "afterAll and global teardown run cleanup; failures keep a screenshot and a trace."

    # ---------------------------------------------------------------------------
    9_edge_cases:
      - "Signup rejected (duplicate or invalid): fails with the app's error; each user gets a new inbox address."
      - "Verification or invitation email not received within the timeout: the spec fails with the mailbox and step named (SES rejected the send, or delivery is slow)."
      - "Link not found in the email: the spec fails; the helper tries the plain URL, then the decoded tracking URL."
      - "Paid checkout fails: the spec stops; cleanup still runs."
      - "Documents rejected: only PDFs starting with %PDF- and under 10 MB are used."
      - "429 after a quick re-run: wait about 60 seconds."
      - "Stale build: rebuild after pulling code (VITE_* values are set at build time)."

    # ---------------------------------------------------------------------------
    10_security:
      authentication: "Real signup and login forms; no auth bypass; no direct user, token, invitation or subscription creation."
      authorization: >-
        Browser route guards are not the security boundary. Server authorization is enforced by withAuth / requireRole
        in the Pages Functions; guard presence is checked by guardPresence.property.test.ts and the role guards' allow/deny
        decisions are unit-tested (per-endpoint-deny.test.ts and the RBAC deny tests). Playwright covers browser-level role
        behaviour only.
      helpers: "razorpay.ts only drives the checkout UI. cleanup.ts writes only to local databases (other hosts are refused) and deletes only the current run's data."
      secrets_and_reports: "MAILSLURP_API_KEY lives only in .env.e2e (gitignored; the example file holds an empty value) and is never printed or put in a VITE_ variable. Credentials are generated per run and not stored. playwright-report/ and test-results/ (traces can contain tokens) are gitignored. Faculty temporary passwords exist only in the run and in the deleted records."
      external_data: "Verification and invitation emails (with their tokens) pass through MailSlurp; they belong to throwaway E2E users only."

    # ---------------------------------------------------------------------------
    11_testing_plan:
      unit: "Unchanged; Vitest must not pick up e2e/."
      e2e: "Specs and phases in sections 5 and 6."
      manual: "Before each phase: one manual run of that role's journey to confirm steps and selectors; `node scripts/check-mailslurp.mjs` passes."
      verification_of_setup:
        - "`npm run e2e` passes twice in a row; second run starts from a clean state."
        - "Leak check: no E2E rows remain after cleanup; no E2E inboxes remain in MailSlurp."
        - "`npm test`, lint and typecheck pass."
        - "`git status` shows .env.e2e, playwright-report/ and test-results/ ignored."

    # ---------------------------------------------------------------------------
    12_risks:
      - risk: "MailSlurp / SES email delivery"
        impact: "Signup or invitation specs time out waiting for the email."
        mitigation: "Verified working on 2026-10-06; `scripts/check-mailslurp.mjs` before runs; clear error naming the step; delivery wait of about 90 seconds."
      - risk: "MailSlurp free-plan limit (500 incoming emails a month) and external dependency"
        impact: "Specs stop working when the quota is used up or MailSlurp/internet is unavailable."
        mitigation: "About 17 emails per full run (about 29 full runs a month); CSV imports use 2 rows; per-role spec runs; upgrade or a team account if usage grows (OPEN)."
      - risk: "Real emails sent through SES from each developer's configured sender"
        impact: "Real send volume from the SES account (probably the production sender)."
        mitigation: "Team decision on using this sender for E2E (OPEN)."
      - risk: "Razorpay hosted checkout"
        impact: "Paid-plan steps flaky or blocked offline."
        mitigation: "Isolated in razorpay.ts; no database workaround; fix the helper if Razorpay's page changes."
      - risk: "Login and signup rate limits"
        impact: "429 errors."
        mitigation: "Specs run one after another; new address per user; wait when needed."
      - risk: "Refresh-token / session handling"
        impact: "A reused login is revoked and later steps fail."
        mitigation: "One context per journey; fresh login after each logout."
      - risk: "Cleanup misses records"
        impact: "Leftover data and later failures."
        mitigation: "Leak check in Phase 1; manual cleanup command; run manifest, tagged inboxes and E2E names."
      - risk: "UI-only pages and navigation gaps"
        impact: "Smoke tests pass without proving a feature."
        mitigation: "Marked UI-only in the inventory; no persistence asserted."
      - risk: "Local environment and startup"
        impact: "Tests hit the wrong database or fail to start."
        mitigation: "Documented commands; .dev.vars check; helpers refuse non-local databases."

    # ---------------------------------------------------------------------------
    13_open_questions:
      - "What is the verified command set to start the local stack (npm start also starts workers that dev:stack starts; `npm run build:dev` + `npm run pages:dev` is the likely replacement)?"
      - "Who owns the MailSlurp account and API key, how is it shared with developers, and is the free plan (500 incoming emails a month) enough?"
      - "Is a chosen address (e2e-<runId>-<user>@...) available on the MailSlurp plan, or do tests use the random inbox addresses and rely on the run manifest and tags for cleanup?"
      - "Is sending the E2E emails through the configured SES sender acceptable?"
      - "Do new faculty need a license assigned from the license-pool page before the educator pages open?"
      - "Do the SSO queue consumers (admission, sync, email queues) run in the local stack, so the CSV imports complete and learner invitation emails are sent?"
      - "Does a learner created by an admin use the organisation's access or need a personal plan, and does the Add Learner modal show the temporary password?"
      - "Are University Admin UI-only pages kept as smoke tests, or excluded until they have a backend?"
      - "Task ID, priority and effort."

    # ---------------------------------------------------------------------------
    14_developer_self_review:
      checklist:
        - "[ ] Reference data present in both local databases; stack starts with the documented commands; check-mailslurp.mjs passes"
        - "[ ] Each phase's exit criteria met before the next phase"
        - "[ ] No fixed users, no storageState, no cookie reuse; nothing created directly in a database; one context per journey"
        - "[ ] Cleanup deletes only the run's data and local-database only; leak check passes; MailSlurp inboxes deleted"
        - "[ ] Document PDFs committed; Razorpay handling isolated in razorpay.ts"
        - "[ ] MAILSLURP_API_KEY only in .env.e2e; .env.e2e in .gitignore; `npm run e2e`, `npm test`, lint and typecheck pass"

    # ---------------------------------------------------------------------------
    versioning:
      v1_0_mvp:
        new: ["playwright.config.ts", "helpers (test-data, mailbox, razorpay, cleanup)", "e2e/learner.spec.ts", ".env.e2e.example", "e2e scripts"]
        modified: ["package.json", "vitest.config.js", ".gitignore"]
        unchanged: ["Application behaviour", "Existing Vitest suite"]
      v1_1_plus:
        new: ["document fixtures and school-admin.spec.ts (v1.1)", "college-admin.spec.ts (v1.2)", "recruiter-admin.spec.ts (v1.3)", "university-admin.spec.ts and access-control checks (v1.4)"]
        modified: ["cleanup.ts as table coverage grows"]
        unchanged: ["Application behaviour"]
      v2_0:
        note: "No major release items planned."
        deprecated: []
