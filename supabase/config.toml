# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "skillpassport"

[api]
enabled = true

# Port to use for the API URL.
port = 54321

# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API endpoints.
# `public` and `graphql_public` schemas are included by default.
schemas = [
  "public",
  "graphql_public",
]

# Extra schemas to add to the search_path of every request.
extra_search_path = [
  "public",
  "extensions",
]

# The maximum number of rows returned from a view, table, or stored procedure.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false

# cert_path = "../certs/my-cert.pem"
# key_path  = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322

# Port used by db diff command to initialize the shadow database.
shadow_port = 54320

# The database major version to use. Keep this aligned with your remote database.
major_version = 17

[db.pooler]
enabled = false

# Port to use for the local connection pooler.
port = 54329

# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"

# How many server connections to allow per user/database pair.
default_pool_size = 20

# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true

# Ordered list of schema files that describe your database.
schema_paths = []

[db.seed]
  # Choose environment seeds explicitly with db:reset:dev or db:reset:prod.
enabled = false

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false

# List of IPv4 CIDR blocks allowed to connect to the database.
allowed_cidrs = [
  "0.0.0.0/0",
]

# List of IPv6 CIDR blocks allowed to connect to the database.
allowed_cidrs_v6 = [
  "::/0",
]

[realtime]
enabled = false

# ip_version = "IPv6"
# max_header_length = 4096

[studio]
enabled = true

# Port to use for Supabase Studio.
port = 54323

# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"

# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Authentication and email are owned by the SSO and email workers.
[local_smtp]
enabled = false

# Files are stored through the Cloudflare R2 binding.
[storage]
enabled = false

# Explicitly disable the service; omitting this table enables CLI defaults.
# roles.sql supplies only the SQL compatibility helper needed by old migrations.
[auth]
enabled = false

[edge_runtime]
enabled = false

# per_worker enables hot reload during local development.
policy = "per_worker"

# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083

# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = false

port = 54327
backend = "postgres"

[experimental]
# OrioleDB is experimental and hosted-only.
orioledb_version = ""
