business_logic:
  execution_flow: >
    Upload -> client-side text extraction (PDF line-reconstructed via
    hasEOL/Y-position) -> POST /api/career/parse-resume ->
    parseResumeDeterministic(): regex.ts extracts name/email/phone/social
    links; detectSections() locates Education/Experience/Skills/Projects/
    Certifications/Bio/Languages by heading synonym; each section is parsed
    into its schema array shape via blank-line entry splitting and
    line-position/keyword heuristics (degree-vs-institution order,
    role-vs-organization order, pipe-delimited Org|Role|Duration); parser.ts
    assembles the final JSON and currently derives the top-level learner
    education fields (university/college_school_name/branch_field) using
    the existing primary-education selection logic
    (pickPrimaryEducationEntry). The business rule for selecting the
    primary education is still pending final validation — see
    open_questions -> review/edit UI -> Save to Database ->
    saveResumeToTables() -> /resume/save inserts rows and updates learner
    flat fields -> onDataExtracted() merges into local UI state only.

edge_cases: >
  Unknown/unsupported section headings: content merges into the preceding
  known section rather than being lost or corrupting another section.
  OCR/PDF text artifacts (e.g. words fused with no space, such as
  "Bachelorof Engineering"): handled via keyword regexes anchored only at
  the start of the keyword. Unsupported resume layouts: multi-column PDFs
  are not supported (extraction assumes single-column reading order);
  multi-project resumes may still merge into a single entry for some PDF
  layouts — see known_remaining_issues. Missing optional fields (e.g. no
  Certifications or Languages section present): the corresponding output
  field is returned empty rather than causing a failure. Concurrency,
  retries, permissions, and payload validation are unchanged from the
  pre-existing handlers.

