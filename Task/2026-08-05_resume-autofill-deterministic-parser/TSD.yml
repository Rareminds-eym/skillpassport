  existing_flow: >
    ResumeParser.jsx: extractTextFromFile() [PDF word-joined, no line breaks
    / DOCX paragraph-preserving / TXT passthrough] -> parseResumeWithAI()
    -> POST /api/career/parse-resume -> OpenRouter call -> AI JSON ->
    Review/Edit UI -> saveResumeToTables() -> POST /api/resume/save ->
    INSERT education/experience/skills/certificates/projects/trainings +
    UPDATE learners -> onDataExtracted() -> handleResumeDataExtracted() ->
    mergeResumeData() + a second updateProfile() write to learners.

    Two structural issues were identified in this flow during investigation:
    PDF extraction discarded line/paragraph structure, and a double-write
    existed between /resume/save and the post-save updateProfile() call.
    Both were addressed as part of this implementation; final end-to-end
    verification is still pending where noted under known_remaining_issues.

    Note: parseResumeWithAI() remains the function name in
    resumeParserService.ts by deliberate scope decision (frontend
    service-layer renaming was treated as documentation-only cleanup, not a
    code change) — it no longer triggers any AI call; it forwards to the
    same /api/career/parse-resume endpoint now served by
    parseResumeDeterministic().

proposed_solution:
  solution_overview: >
    1) New deterministic parser module returning the same ParsedResumeData
    shape the AI path produced. 2) Swap the AI call in parse-resume.ts for
    the new parser — no request/response contract change. 3) Fix PDF text
    extraction to reconstruct line structure via PDF.js's hasEOL flag and
    Y-position, since the parser's section detection is line-oriented and
    the AI path never required that structure. 4) Remove the redundant
    post-save updateProfile() write in both frontend call sites.
  why_this_approach: >
    Deterministic design (regex + section detection + line-position rules,
    no NLP/ML) meets the requirement to remove AI dependency while staying
    small (4 files) and readable. PDF extraction was fixed rather than the
    parser redesigned for flat text: the parser's line-based design is
    already correct for DOCX; only the PDF extractor failed to produce
    line-structured output, and extractTextFromPDF has no other callers, so
    the fix has no blast radius elsewhere. The redundant updateProfile()
    write was removed rather than patched, since /resume/save is already
    the authoritative writer for the same fields in the same user action.
  alternatives_considered: >
    Flat-text parser redesign — rejected, lower accuracy ceiling and would
    degrade the working DOCX path. AI kept as fallback — rejected per
    product direction (full AI removal). Diff-aware merge instead of
    removing the second write — rejected; still leaves two writers to the
    same row.
  design_principle: >
    /resume/save is the single source of truth for persistence during
    resume imports. Resume import callbacks in the frontend synchronize UI
    state only and must not perform a second write to learner profile data.

technical_design:
  architecture_diagram: |
    Resume Upload (ResumeParser.jsx)
      |
      +- extractTextFromFile()
      |    +- PDF  -> extractTextFromPDF() -> reconstructLinesFromTextItems()
      |    |         [hasEOL + Y-position line/paragraph reconstruction]
      |    +- DOCX -> extractTextFromDOCX()  [unchanged]
      |    +- TXT  -> passthrough  [unchanged]
      |
      +- Resume Parsing Service (resumeParserService.ts) [backend call is now AI-free]
      |    -> POST /api/career/parse-resume
      |         -> handleParseResume() -> parseResumeDeterministic()
      |              functions/api/career/handlers/resume-parser/
      |              +- types.ts         — ParsedResumeData schema
      |              +- regex.ts         — name, email, phone, social links
      |              +- sectionParser.ts — detectSections() + parse*Block()
      |              +- parser.ts        — orchestration
      |
      +- Review/Edit UI -> "Save to Database"
      |    -> saveResumeToTables() -> POST /api/resume/save  [unchanged]
      |         -> INSERT education/experience/skills/certificates/projects/trainings
      |         -> UPDATE learners (flat fields)
      |
      +- onDataExtracted() -> handleResumeDataExtracted()  [MainSettings.jsx / ProfileEditSection.jsx]
           -> mergeResumeData() -> setProfileData() / refresh()  [no second write]
           -> updateEducation() / handleSave('education'|...) for array sections [unchanged]
  sequence_diagram: |
    Learner uploads PDF -> extractTextFromPDF() reconstructs lines
    -> "Parse Resume" -> POST resumeText -> parseResumeDeterministic()
    -> ParsedResumeData returned -> review/edit -> "Save to Database"
    -> saveResumeToTables() -> POST /api/resume/save -> INSERT rows +
    UPDATE learners -> onDataExtracted() -> handleResumeDataExtracted()
    -> mergeResumeData() -> setProfileData() (local only) -> UI reflects
    the /resume/save write directly.
  database_changes: >
    None. No migrations. All writes target existing columns on existing
    tables (learners, education, experience, projects, skills,
    certificates, trainings).
  er_diagram: "Not applicable — no schema changes."
  api_contract:
