known_remaining_issues:
  - title: "Learner profile update flow — final verification pending"
    detail: >
      The double-write between /resume/save and the post-save
      updateProfile() call was removed in both MainSettings.jsx and
      ProfileEditSection.jsx. Verified by code inspection and by tracing
      the prior bug against real database timestamps. End-to-end
      re-verification (fresh learner account, resume import, confirm
      pre-filled fields persist without reversion) has not yet been
      performed.
  - title: "Multi-project resumes may still merge into a single project"
    detail: >
      splitEntries() requires a blank line to detect entry boundaries.
      PDF line-reconstruction restores line breaks but does not reliably
      produce a detectable gap between consecutive project entries for all
      PDF layouts (confirmed against real Y-position data on the tested
      resume). Requires further refinement — a title-pattern-based boundary
      fallback was proposed but not implemented.
  - title: "Resume re-import is insert-only"
    classification: "Production Limitation"
    detail: >
      /resume/save inserts into education, experience, projects,
      certificates, and trainings with no de-duplication, update, or
      delete-then-replace logic (skills has partial de-duplication by
      name+type only). Repeated imports accumulate duplicate rows;
      confirmed in testing. This is a high-impact production limitation:
      learners are expected to upload updated resumes over time, making
      this a common usage scenario rather than a rare edge case. Agreed
      long-term direction: move to a synchronization-based approach —
      fetch the learner's existing records, compare each parsed record
      against them using deterministic matching rules per entity, leave
      unchanged records untouched, update changed records, and insert new
      records. Handling for existing records no longer present in the
      latest resume is not yet decided (options include soft-hide, delete,
      or leave untouched) and requires a separate business-rule decision.
      This is a future enhancement and is not part of the current
      implementation.

