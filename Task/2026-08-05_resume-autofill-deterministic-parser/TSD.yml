task_information:
  task_id: RESUME-PARSER-2026-08
  title: "Resume Auto-Fill Refactor – Deterministic Parser, PDF Extraction Improvements & Save Flow"
  task_type: "Architectural Refactor + Bug Fixes"
  priority: High
  estimated_effort: "Large (parser module + PDF extraction layer + save/refresh flow)"

problem_statement:
  business_requirement: >
    Learners upload a resume (PDF/DOCX/TXT) on the Settings page and have
    their profile — personal details, education, experience, projects,
    skills, certifications — auto-populated from it.
  current_behaviour: >
    Extraction used an AI/LLM call (OpenRouter, openai/gpt-3.5-turbo with
    fallbacks) in functions/api/career/handlers/parse-resume.ts, with
    per-request cost and non-deterministic output.
  expected_behaviour: >
    Same UI flow (upload -> parse -> review/edit -> save), extraction done
    via deterministic rules (regex, section detection, line-position
    heuristics) with no AI/LLM call. Output schema, API contract, and
    /resume/save endpoint are unchanged.

scope:
  in_scope:
    - "functions/api/career/handlers/parse-resume.ts — AI call replaced with deterministic parser"
    - "New module: functions/api/career/handlers/resume-parser/ (parser.ts, sectionParser.ts, regex.ts, types.ts)"
    - "src/widgets/learner-dashboard/ui/ResumeParser.jsx — PDF line-reconstruction fix (extractTextFromPDF, reconstructLinesFromTextItems)"
    - "src/widgets/learner-dashboard/ui/settings/MainSettings.jsx — handleResumeDataExtracted double-write fix"
    - "src/widgets/learner-dashboard/ui/ProfileEditSection.jsx — handleResumeDataExtracted double-write fix (second call site)"
    - "src/features/digital-portfolio/api/resumeParserService.ts — mergeResumeData field-mapping additions (college, school_name, branch)"
  out_of_scope:
    - "functions/api/resume/save.ts insert/upsert/delete semantics — investigated, not modified (see known_remaining_issues)"
    - "Two-column PDF layouts — extraction fix targets single-column resumes"
    - "OCR for scanned/image-based PDFs — unchanged, unsupported"
    - "Other AI-backed career endpoints (chat, analyze-assessment, field-keywords) — unaffected"
    - "functions/api/learners/profile.ts — separate endpoint, not modified, flagged for separate review"

